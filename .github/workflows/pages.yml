name: Deploy Reports to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - "data/triggers.json"
      - "tools/trigger_scanner.py"
      - "scripts/build-github-pages.py"
      - "requirements-pages.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install page build dependencies
        run: python -m pip install -r requirements-pages.txt

      - name: 重新生成触发监控日报（零通知，Pages 使用最新 triggers.json）
        run: |
          # 只重生成日报 md，不调用 notify_serverchan，故绝不触发微信通知。
          # 失败时回退到仓库内已提交的日报，避免行情接口抖动拖垮 Pages 部署。
          python3 tools/trigger_scanner.py \
            || echo "⚠️ 触发监控日报生成失败，将使用仓库内已提交版本继续构建"

      - name: Build reports site
        run: python scripts/build-github-pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
