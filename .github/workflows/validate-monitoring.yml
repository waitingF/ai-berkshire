name: 监控规则校验

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-monitoring:
    name: validate-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitoring.txt

      - name: 安装测试依赖
        run: python -m pip install -r requirements-monitoring.txt

      - name: 运行完整离线校验
        run: bash scripts/validate-monitoring.sh --full
