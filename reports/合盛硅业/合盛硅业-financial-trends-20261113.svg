<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">合盛硅业收入结构与五年盈利趋势</title><desc id="desc">2025收入结构：工业硅44.28%，有机硅46.71%，其他9.01%。2021至2025归母净利82.22、51.48、26.23、17.40、负29.91亿元。</desc>
<rect width="1200" height="540" rx="16" fill="#f8fafb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#183444">
<text x="42" y="47" font-size="23" font-weight="600">合盛硅业：收入结构与盈利周期</text>
<text x="42" y="76" font-size="14" fill="#647782">人民币亿元；2021采用后续重述口径；2026前三季未年化</text>
<text x="42" y="117" font-size="18">2025年收入构成（合并总收入为分母）</text>
<rect x="42.00" y="138" width="491.52" height="38" fill="#217c8d"/>
<rect x="533.52" y="138" width="518.47" height="38" fill="#68a6a0"/>
<rect x="1051.99" y="138" width="100.01" height="38" fill="#cbd5dd"/>
<rect x="42" y="195" width="14" height="14" fill="#217c8d"/><text x="64" y="208" font-size="16">工业硅 44.28%</text>
<rect x="392" y="195" width="14" height="14" fill="#68a6a0"/><text x="414" y="208" font-size="16">有机硅 46.71%</text>
<rect x="742" y="195" width="14" height="14" fill="#cbd5dd"/><text x="764" y="208" font-size="16">其他 9.01%</text>
<text x="42" y="258" font-size="18">归母净利润：峰值盈利不能直接外推</text><line x1="65" y1="420" x2="1145" y2="420" stroke="#b9c7d0"/>
<rect x="110" y="296.66" width="90" height="123.34" rx="3" fill="#217c8d"/><text x="155" y="286.66" text-anchor="middle" font-size="18">82.22</text><text x="155" y="500" text-anchor="middle" font-size="16">2021</text>
<rect x="325" y="342.78" width="90" height="77.22" rx="3" fill="#217c8d"/><text x="370" y="332.78" text-anchor="middle" font-size="18">51.48</text><text x="370" y="500" text-anchor="middle" font-size="16">2022</text>
<rect x="540" y="380.66" width="90" height="39.34" rx="3" fill="#217c8d"/><text x="585" y="370.66" text-anchor="middle" font-size="18">26.23</text><text x="585" y="500" text-anchor="middle" font-size="16">2023</text>
<rect x="755" y="393.89" width="90" height="26.11" rx="3" fill="#217c8d"/><text x="800" y="383.89" text-anchor="middle" font-size="18">17.40</text><text x="800" y="500" text-anchor="middle" font-size="16">2024</text>
