<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="中国核电：收入主要来自核电售电"><rect width="1000" height="430" fill="#fafbf9"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#253745"><text x="50" y="44" font-size="24" font-weight="600">中国核电：收入主要来自核电售电</text><text x="50" y="73" fill="#667781" font-size="14">商品分类；两条均归一为100%，全年与半年金额不作直接同比</text><text x="50" y="157" font-size="18">2025全年</text><rect x="180.00" y="128" width="590.13" height="49" fill="#325f78"/><text x="475.07" y="159" text-anchor="middle" font-size="17" fill="white">79.7%</text><rect x="770.13" y="128" width="49.09" height="49" fill="#5d948c"/><text x="794.67" y="159" text-anchor="middle" font-size="17" fill="white">6.6%</text><rect x="819.22" y="128" width="78.66" height="49" fill="#c39455"/><text x="858.55" y="159" text-anchor="middle" font-size="17" fill="white">10.6%</text><rect x="897.88" y="128" width="22.12" height="49" fill="#c7d0d4"/><text x="50" y="269" font-size="18">2026上半年</text><rect x="180.00" y="240" width="593.38" height="49" fill="#325f78"/><text x="476.69" y="271" text-anchor="middle" font-size="17" fill="white">80.2%</text><rect x="773.38" y="240" width="50.08" height="49" fill="#5d948c"/><text x="798.42" y="271" text-anchor="middle" font-size="17" fill="white">6.8%</text><rect x="823.46" y="240" width="75.03" height="49" fill="#c39455"/><text x="860.97" y="271" text-anchor="middle" font-size="17" fill="white">10.1%</text><rect x="898.49" y="240" width="21.51" height="49" fill="#c7d0d4"/><rect x="170" y="350" width="18" height="18" fill="#325f78"/><text x="197" y="365" font-size="16">核电</text><rect x="360" y="350" width="18" height="18" fill="#5d948c"/><text x="387" y="365" font-size="16">风电</text><rect x="550" y="350" width="18" height="18" fill="#c39455"/><text x="577" y="365" font-size="16">光伏</text><rect x="740" y="350" width="18" height="18" fill="#c7d0d4"/><text x="767" y="365"